# edt1 is the lab's common time source (goal 2026-09-01): serve NTP to every
# lab-facing subnet. Upstream sync stays as shipped: Ubuntu NTS pools
# (authenticated), see /etc/chrony/chrony.conf. Containers share the host
# clock by construction; these allows are for VMs (edy-lab), lab bridges,
# and anything that later joins the AD lab networks.
allow 172.15.4.0/24
allow 172.16.4.0/24
allow 172.20.10.0/24
allow 172.30.10.0/24
# Serve sane time even if upstream is briefly unreachable (host RTC quality).
local stratum 10 orphan

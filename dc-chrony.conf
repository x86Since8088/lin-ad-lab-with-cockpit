# AD DC time service — chrony config for cockpit-adlab DC containers.
#
# Purpose: serve SIGNED (MS-SNTP) time to Windows domain members. Windows
# members sync from their authenticating DC (the NT5DS provider) and REQUIRE a
# signed NTP reply — an unsigned server is discarded ("The peer is
# unreachable"). samba supplies the signing (its ntp_signd socket); chrony is
# the NTP server that uses it. The DCs previously ran no NTP daemon at all,
# which is why members reported their DC unreachable as a time source.
#
# Started by dc-entrypoint.sh as:  chronyd -x -f /etc/chrony/adlab-dc.conf
#   -x = do NOT discipline the system clock. Lab containers share the host
#        clock by construction, so chrony must only *serve* time here, never
#        step or slew it (which would fight the host's own chrony).

# Real upstream: the lab's common time source is the edt1 host. podman maps
# host.containers.internal to the container's gateway (the host) on every lab
# network, so this needs no per-DC or per-subnet substitution. Syncing here
# gives chrony a genuine "synchronised" state and a real stratum — Windows
# rejects a DC whose clock is not synchronised (leap indicator = alarm).
server host.containers.internal iburst

# Fallback: keep serving our own (host-derived) clock at stratum 10 if the
# upstream is briefly unreachable, so members never see an unsynchronised DC.
local stratum 10

# MS-SNTP: sign replies to domain members using samba's signing socket. This is
# the default path samba creates in AD DC mode; no smb.conf change is required.
ntpsigndsocket /var/lib/samba/ntp_signd/socket

# Serve the lab subnets (mirrors the edt1 host's chrony serve policy): the DC
# networks, the member/client networks, and the additional forests.
allow 172.15.4.0/24
allow 172.16.4.0/24
allow 172.20.10.0/24
allow 172.30.10.0/24
allow 10.44.0.0/16

driftfile /var/lib/chrony/adlab-dc.drift

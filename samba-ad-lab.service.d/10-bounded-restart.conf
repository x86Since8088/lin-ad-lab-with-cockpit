# Added 2026-10-04 (edt1 restart-loop incident). Rollback: rm -r this directory; systemctl daemon-reload
#
# Before: Restart=on-failure + RestartSec=15 but StartLimitIntervalSec=10 (default) -> the
# start limit could never trip (15 s > 10 s window), so any failure of 21-start.sh looped
# forever: ~21 CPU-s / ~27 s wall per cycle, 25 "left-over conmon" warnings per cycle,
# NRestarts reached 275 in ~2 h. Now: at most 5 attempts per hour, 60 s apart, then the unit
# stays "failed (start-limit-hit)" and the lab containers are left as they are.
# Manual retry: systemctl reset-failed samba-ad-lab.service && systemctl start samba-ad-lab.service
[Unit]
StartLimitIntervalSec=1h
StartLimitBurst=5

[Service]
RestartSec=60

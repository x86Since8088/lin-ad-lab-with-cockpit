# samba-ad-lab — client-side smb.conf for HOST tools only.
#
# Why this file exists
# -------------------
# The host's real /etc/samba/smb.conf is a standalone SMB *file server*
# config: workgroup = WORKGROUP, security = user, and no `realm`. Samba's
# client credential code (samba-tool, smbclient, net, python3-samba) reads
# that file to work out which realm to ask for a Kerberos ticket for. With
# no realm it silently gives up on Kerberos and binds ANONYMOUSLY, which
# is why `samba-tool user list -H ldap://dc1...` returns
#     00002020: Operation unavailable without authentication
#
# Pointing the client tools at THIS file with `--configfile` (samba-tool,
# net) or `-s` (smbclient) tells them the realm without touching the host's
# production smbd config and without joining the host to the domain.
#
# Nothing reads this file except tools you explicitly point at it.

[global]
    workgroup = EDT1LAB
    realm = AD.EDT1.LAB

    # Client-only. This host is NOT a member of the domain; `security = ads`
    # here only affects how these client tools authenticate outbound.
    security = ads

    # The lab DCs run Samba 4.23 and require modern SMB.
    client min protocol = SMB3_11
    client max protocol = SMB3_11
    client signing = required

    # Do not let these tools believe they own any local domain state.
    netbios name = EDT1
    disable netbios = yes
    dns proxy = no

    # Keep client runtime state out of the system dirs used by the real smbd.
    private dir = /tmp
    log level = 0
